version: '3.8'
services:
      db:
            image: timescale/timescaledb:latest-pg16
            container_name: k13t_db
            restart: always
            # env_file:
            #   - ../../../../.env
            environment:
                  - POSTGRES_USER=${POSTGRES_USER}
                  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                  - POSTGRES_DB=${POSTGRES_DB}
            # volumes:
            #       - ./src/Server/shared/database/init:/docker-entrypoint-initdb.d
            ports:
                  - "5432:5432"
